[project]
name = "grampy-q"
dynamic = ["version"]
description = "A small workflow graph (DAG) and node journal for work queues, with pluggable storage drivers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Berlioz" }]
requires-python = ">=3.10"
# The core has NO dependency: the graph, the claim rule and the journal
# logic are plain Python. Only the postgres driver needs SQLAlchemy.
dependencies = []

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0"]
test = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "grampy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
